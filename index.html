<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>工地考勤打卡系统 (云端同步版)</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- QR Code 生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Firebase SDK (模块化导入) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ 请在这里替换为您在 Firebase 控制台获取的真实配置 ⚠️
        const firebaseConfig = {
            apiKey: "AIzaSyABkG-vKfnWvFTsm4_0HbxhYmjF6Hl915I",
  authDomain: "sg-check-in-out.firebaseapp.com",
  projectId: "sg-check-in-out",
  storageBucket: "sg-check-in-out.firebasestorage.app",
  messagingSenderId: "122032675688",
  appId: "1:122032675688:web:f052ffd60e484dd5ed54dd",
  measurementId: "G-NQ4PK3FC0H"
        };

        // 初始化 Firebase 与 Firestore 数据库
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.firestoreTools = { collection, addDoc, onSnapshot, query, orderBy, getDocs };
    </script>

    <style>
        .active-tab { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-10">

    <!-- 顶栏导航 -->
    <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center gap-2">
            <i class="fa-solid font-hard-hat"></i> 工地考勤定位打卡
        </h1>
        <span id="cloudStatus" class="text-xs bg-blue-700 px-2 py-1 rounded-full flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-yellow-400 inline-block animate-pulse"></span> 云端连接中...
        </span>
    </header>

    <!-- 导航切换 -->
    <nav class="bg-white shadow flex border-b">
        <button onclick="switchTab('checkin')" id="tab-checkin" class="flex-1 py-3 text-center active-tab font-medium">
            <i class="fa-solid fa-location-dot mr-1"></i> 工人打卡
        </button>
        <button onclick="switchTab('admin')" id="tab-admin" class="flex-1 py-3 text-center font-medium text-slate-500">
            <i class="fa-solid fa-user-shield mr-1"></i> 管理后台
        </button>
    </nav>

    <!-- 主体区域 -->
    <main class="max-w-md mx-auto p-4">

        <!-- 工人打卡页面 -->
        <section id="page-checkin" class="space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold mb-4 text-slate-700 flex items-center gap-2">
                    <i class="fa-solid fa-id-card text-blue-600"></i> 打卡信息
                </h2>
                
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">选择工地/项目部</label>
                        <select id="siteSelect" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="默认工地(示例)">默认工地(示例)</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">姓名</label>
                        <input type="text" id="workerName" placeholder="请输入您的姓名" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">手机号码</label>
                        <input type="tel" id="workerPhone" placeholder="请输入手机号码" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <!-- GPS 定位状态 -->
                <div class="mt-4 p-3 bg-slate-50 rounded-xl border border-slate-200">
                    <div class="flex justify-between items-center mb-1">
                        <span class="text-xs font-semibold text-slate-500">当前 GPS 状态</span>
                        <button onclick="getLocation()" class="text-xs text-blue-600 hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-rotate-right"></i> 重新获取
                        </button>
                    </div>
                    <div id="locationStatus" class="text-xs text-slate-500">正在获取地理位置...</div>
                </div>

                <!-- 打卡按钮组 -->
                <div class="grid grid-cols-2 gap-3 mt-5">
                    <button onclick="submitCheckin('上班签到')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg active:scale-95 transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-sun"></i> 上班签到
                    </button>
                    <button onclick="submitCheckin('下班签退')" class="bg-amber-600 hover:bg-amber-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg active:scale-95 transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-moon"></i> 下班签退
                    </button>
                </div>
            </div>
        </section>

        <!-- 管理后台页面 -->
        <section id="page-admin" class="hidden space-y-4">
            
            <!-- 密码验证面板 -->
            <div id="adminAuth" class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 mb-3"><i class="fa-solid fa-lock text-slate-500"></i> 管理员登录</h2>
                <input type="password" id="adminPwd" placeholder="请输入管理员密码 (默认: jianlin2008)" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg mb-3">
                <button onclick="loginAdmin()" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-bold">登录后台</button>
            </div>

            <!-- 管理面板内容 -->
            <div id="adminContent" class="hidden space-y-4">
                
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-slate-700"><i class="fa-solid fa-list-check"></i> 实时考勤日志 (全员)</h3>
                    <button onclick="exportCSV()" class="text-xs bg-slate-700 text-white px-3 py-1.5 rounded-lg">
                        <i class="fa-solid fa-file-csv"></i> 导出 Excel
                    </button>
                </div>

                <!-- 实时打卡列表 -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div id="recordList" class="divide-y divide-slate-100 max-h-96 overflow-y-auto p-2 text-xs text-slate-500">
                        加载中...
                    </div>
                </div>

            </div>
        </section>

    </main>

    <script>
        let currentLocation = null;
        let globalRecords = [];

        // 初始化 GPS
        window.onload = function() {
            getLocation();
            initCloudSync();
        };

        function switchTab(tab) {
            document.getElementById('page-checkin').classList.toggle('hidden', tab !== 'checkin');
            document.getElementById('page-admin').classList.toggle('hidden', tab !== 'admin');
            document.getElementById('tab-checkin').className = tab === 'checkin' ? 'flex-1 py-3 text-center active-tab font-medium' : 'flex-1 py-3 text-center font-medium text-slate-500';
            document.getElementById('tab-admin').className = tab === 'admin' ? 'flex-1 py-3 text-center active-tab font-medium' : 'flex-1 py-3 text-center font-medium text-slate-500';
        }

        // 获取位置
        function getLocation() {
            const status = document.getElementById('locationStatus');
            status.innerHTML = `<span class="text-blue-500"><i class="fa-solid fa-spinner animate-spin"></i> 正在定位...</span>`;
            
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        currentLocation = {
                            lat: pos.coords.latitude.toFixed(6),
                            lng: pos.coords.longitude.toFixed(6),
                            accuracy: Math.round(pos.coords.accuracy)
                        };
                        status.innerHTML = `<span class="text-emerald-600 font-medium"><i class="fa-solid fa-circle-check"></i> 已定位 (${currentLocation.lat}, ${currentLocation.lng}) 精度: ${currentLocation.accuracy}米</span>`;
                    },
                    err => {
                        status.innerHTML = `<span class="text-red-500"><i class="fa-solid fa-triangle-exclamation"></i> 定位失败，请开启手机 GPS 权限</span>`;
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            } else {
                status.innerHTML = `<span class="text-red-500">您的浏览器不支持 GPS 定位</span>`;
            }
        }

        // 初始化 Firebase 实时同步监听
        function initCloudSync() {
            const checkInterval = setInterval(() => {
                if (window.db && window.firestoreTools) {
                    clearInterval(checkInterval);
                    document.getElementById('cloudStatus').innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 inline-block"></span> 云端实时同步已就绪`;

                    const { collection, onSnapshot, query, orderBy } = window.firestoreTools;
                    const q = query(collection(window.db, "attendance_records"), orderBy("timestamp", "desc"));

                    // 监听实时更新
                    onSnapshot(q, (snapshot) => {
                        globalRecords = [];
                        snapshot.forEach((doc) => {
                            globalRecords.push(doc.data());
                        });
                        renderAdminList();
                    });
                }
            }, 500);
        }

        // 提交打卡到 Firebase 云端
        async function submitCheckin(type) {
            const name = document.getElementById('workerName').value.trim();
            const phone = document.getElementById('workerPhone').value.trim();
            const site = document.getElementById('siteSelect').value;

            if (!name || !phone) {
                alert('请填写真实姓名和手机号码！');
                return;
            }

            if (!window.db) {
                alert('数据库初始化中，请稍后再试！');
                return;
            }

            const record = {
                site: site,
                name: name,
                phone: phone,
                type: type,
                time: new Date().toLocaleString(),
                timestamp: Date.now(),
                location: currentLocation ? `${currentLocation.lat}, ${currentLocation.lng}` : '未知',
                accuracy: currentLocation ? currentLocation.accuracy + '米' : '无'
            };

            try {
                const { collection, addDoc } = window.firestoreTools;
                await addDoc(collection(window.db, "attendance_records"), record);
                alert(`✅ ${type}成功！已实时上云。`);
            } catch (e) {
                console.error("提交失败: ", e);
                alert("❌ 打卡失败，请检查网络后再试！");
            }
        }

        // 验证管理员
        function loginAdmin() {
            const pwd = document.getElementById('adminPwd').value;
            if (pwd === 'jianlin2008') {
                document.getElementById('adminAuth').classList.add('hidden');
                document.getElementById('adminContent').classList.remove('hidden');
                renderAdminList();
            } else {
                alert('密码错误！');
            }
        }

        // 渲染打卡列表
        function renderAdminList() {
            const list = document.getElementById('recordList');
            if (globalRecords.length === 0) {
                list.innerHTML = `<div class="p-4 text-center text-slate-400">暂无任何打卡记录</div>`;
                return;
            }

            list.innerHTML = globalRecords.map(r => `
                <div class="p-3 bg-white flex justify-between items-center hover:bg-slate-50 border-b border-slate-100">
                    <div>
                        <div class="font-bold text-slate-800 text-sm">${r.name} (${r.phone})</div>
                        <div class="text-slate-400 text-xs">${r.site} · ${r.time}</div>
                        <div class="text-slate-400 text-xs">GPS: ${r.location} (误差 ${r.accuracy})</div>
                    </div>
                    <span class="px-2.5 py-1 rounded-full text-xs font-bold ${r.type.includes('上班') ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">
                        ${r.type}
                    </span>
                </div>
            `).join('');
        }

        // 导出 CSV
        function exportCSV() {
            if (globalRecords.length === 0) {
                alert('暂无记录可导出！');
                return;
            }
            let csv = '\uFEFF工地,姓名,手机号,打卡类型,打卡时间,GPS坐标,定位精度\n';
            globalRecords.forEach(r => {
                csv += `"${r.site}","${r.name}","${r.phone}","${r.type}","${r.time}","${r.location}","${r.accuracy}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `工地考勤记录_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }
    </script>
</body>
</html>
